name: automation docker

on:
  push:
    branches: ["main"]
    tags: ["*"]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Thiết lập Docker Buildx để hỗ trợ build nâng cao
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Đăng nhập vào Docker Hub sử dụng secrets đã cấu hình
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      # Trích xuất metadata (tags, labels) cho Docker image
      - name: Get commit count
        id: count
        run: echo "total=$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT

      # 2. Cấu hình Tag tự động
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/nguyenquocminhthong
          tags: |
            # Tag theo số commit: 1.0.152
            type=raw,value=1.0.${{ steps.count.outputs.total }}
            # Luôn cập nhật tag latest
            type=raw,value=latest

      # Build và Push image lên Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
