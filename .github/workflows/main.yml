name: automation docker

on:
  push:
    branches: ["main"]
    tags: ["*"]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/nguyenquocminhthong
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Bước Deploy quan trọng
      - name: Triển khai lên DevOps Classroom
        run: |
          # 1. Khai báo Repo chính xác
          REPO="thonocodesiu/nguyenquocminhthong"
          
          echo "Đang gửi yêu cầu deploy cho: $REPO:latest"
          
          # 2. Gọi Webhook (Dùng -v để debug nếu cần, bỏ -sS nếu muốn xem quá trình tải)
          # Lưu ý: Sửa lại cách lấy BODY để tránh lỗi sed "$d"
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "${{ secrets.DEPLOY_URL }}?repo=$REPO&tag=latest")
          
          # Tách Body và HTTP Code (Cách này an toàn hơn sed)
          BODY=$(echo "$RESPONSE" | head -n -1)
          CODE=$(echo "$RESPONSE" | tail -n1)
          
          echo "Webhook HTTP Code: $CODE"
          
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "❌ Deploy thất bại!"
            echo "::group::Chi tiết phản hồi từ Server (JSON)"
            echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
            echo "::endgroup::"
            exit 1
          fi
          
          echo "✅ Deploy thành công image $REPO."
          echo "::group::Chi tiết phản hồi từ Server (JSON)"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
          echo "::endgroup::"